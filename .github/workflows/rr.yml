name: RR — status-mix runs on prod

# One run per push to the RR branch. Each commit rewrites tests/rr.spec.ts (and,
# when a scenario needs special flags, RR_ARGS below) to produce a different
# TestDino prod run. Flaky needs retries > 0; playwright.config.ts sets retries: 2.
on:
  push:
    branches:
      - RR
  workflow_dispatch:

jobs:
  rr:
    runs-on: ubuntu-latest
    env:
      # Prod reporter + token. playwright.config.ts falls back to the prod
      # reporter when TESTDINO_SERVER_URL is unset, but set it explicitly.
      TESTDINO_SERVER_URL: https://reporter.testdino.com/
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      TESTDINO_TAGS: RR
      # Unique per commit so each push is its own run.
      TESTDINO_CI_RUN_ID: rr-${{ github.sha }}
      # Extra Playwright CLI flags for the current scenario (e.g. --max-failures,
      # --retries=0). Empty for the default scenarios.
      RR_ARGS: "--retries=0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run RR status-mix scenario
        continue-on-error: true
        run: npx playwright test tests/rr.spec.ts --project=chromium $RR_ARGS
