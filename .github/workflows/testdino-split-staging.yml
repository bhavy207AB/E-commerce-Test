name: TestDino split-mode (staging)

# Manual validation of TestDino splitted mode against STAGING with a MIX of
# sharded and unsharded splits. One workflow run == one logical split group.
# Setup + the split-id/ci-run-id contract: docs/TESTDINO_SPLIT_STAGING.md.

on:
  workflow_dispatch: {}

# Never cancel a split group mid-flight: a cancelled leg would leave the group
# with a missing split, and it only finalizes once the idle reaper fires.
concurrency:
  group: testdino-split-${{ github.run_id }}
  cancel-in-progress: false

env:
  # The TESTDINO_STAGING_URL secret rejects TESTDINO_TOKEN with a 401, so use the
  # same literal staging host playwright.yml reports to successfully. Point this
  # back at a secret once a URL/token pair that authenticates is configured.
  TESTDINO_SERVER_URL: https://stg-analytics.testdino.com/
  # Prefer a dedicated staging key, but fall back to TESTDINO_TOKEN, which this
  # repo already points at staging (see playwright.yml). Without the fallback
  # preflight fails on repos that only ever configured the one token.
  TESTDINO_TOKEN: ${{ secrets.TESTDINO_STAGING_TOKEN || secrets.TESTDINO_TOKEN }}
  # The suite drives the public demo storefront; override per-environment.
  BASE_URL: https://storedemo.testdino.com/products

jobs:
  # Fail fast if staging is unreachable or the key is wrong, before spending
  # runner time on browsers. Never print the auth body: it carries Kafka SASL
  # credentials that must not land in CI logs.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify staging reporter is reachable
        run: |
          set -uo pipefail
          [ -n "${TESTDINO_SERVER_URL:-}" ] || { echo "::error::TESTDINO_STAGING_URL secret is not set"; exit 1; }
          [ -n "${TESTDINO_TOKEN:-}" ] || { echo "::error::neither TESTDINO_STAGING_TOKEN nor TESTDINO_TOKEN is set"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "${TESTDINO_SERVER_URL%/}/api/v1/reporter/auth" \
            -H "Authorization: Bearer $TESTDINO_TOKEN" \
            -H "Content-Type: application/json" -d '{}' || echo 000)
          echo "reporter/auth -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::reporter auth failed ($code). Check TESTDINO_STAGING_URL + TESTDINO_STAGING_TOKEN, and that stg-data-handler advertises a PUBLIC KAFKA_CLI_BROKERS reachable from GitHub runners."
            exit 1
          fi
          echo "Reporter auth OK. (Broker + SASL config intentionally not printed: it contains credentials.)"

  split:
    needs: preflight
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      # Browsers are baked into this image, so no `playwright install` step.
      # Keep the version in sync with @playwright/test in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    # One split leg per matrix entry. Splits 1 and 3 are UNSHARDED; split 2 is
    # SHARDED across two legs. All legs share one split-id (one logical run);
    # each split has its own ci-run-id so split 2's shards merge into split 2,
    # and only split 2.
    strategy:
      fail-fast: false # a failing split must NOT cancel its siblings
      # Serialize legs: concurrent browser legs overwhelm the external demo
      # storefront and a leg times out, leaving that split/shard with 0 tests.
      max-parallel: 1
      matrix:
        include:
          - { name: "split 1/3 (unsharded)", slot: "s1",      split: "1/3", ci: "1", shard: "",    specs: "tests/API/ProductAPI.spec.ts tests/API/product.spec.ts" }
          - { name: "split 2/3 shard 1/2",   slot: "s2-sh1",  split: "2/3", ci: "2", shard: "1/2", specs: "tests/additional-500-suites.spec.ts" }
          - { name: "split 2/3 shard 2/2",   slot: "s2-sh2",  split: "2/3", ci: "2", shard: "2/2", specs: "tests/additional-500-suites.spec.ts" }
          - { name: "split 3/3 (unsharded)", slot: "s3",      split: "3/3", ci: "3", shard: "",    specs: "tests/login.spec.ts tests/addToCart.spec.ts" }
    env:
      # Shared across every leg of THIS run -> one aggregated logical run. run_id
      # is stable across all matrix jobs; run_attempt keeps re-runs distinct.
      SPLIT_ID: "gh-${{ github.run_id }}-${{ github.run_attempt }}"
      HOME: /root # the playwright image runs as root; browsers live under /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Installs the repo's @testdino/playwright (file: dep) so `npx tdpw` is the
      # modern CLI that understands --split, not the stale public `tdpw` package.
      - run: npm ci
      - name: Run ${{ matrix.name }}
        run: |
          # --server-url is passed explicitly: playwright.config.ts hardcodes a
          # serverUrl, and config outranks TESTDINO_SERVER_URL in the reporter's
          # CLI > testdino.config > playwright.config > env resolution order.
          npx tdpw test \
            --server-url "$TESTDINO_SERVER_URL" \
            --split ${{ matrix.split }} \
            --split-id "$SPLIT_ID" \
            --ci-run-id "$SPLIT_ID-${{ matrix.ci }}" \
            ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }} \
            ${{ matrix.specs }}
      - name: Upload blob report for ${{ matrix.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Slashes are illegal in artifact names, hence the `slot` alias.
          name: blob-${{ matrix.slot }}
          path: blob-report
          retention-days: 1
