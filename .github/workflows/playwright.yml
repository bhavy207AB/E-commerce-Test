name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  # One spec file, one invocation, one STAGING run carrying all three buckets:
  # 40 passed, 7 failed, 3 interrupted of 50. See the header of
  # tests/status-mix-verification.spec.ts for why --max-failures=7 and
  # --workers=4 are load-bearing rather than incidental.
  staging-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Staging, not prod: playwright.config.ts falls back to the prod reporter
      # when TESTDINO_SERVER_URL is unset, so this must be explicit.
      TESTDINO_SERVER_URL: https://stg-analytics.testdino.com/
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_STAGING_TOKEN }}
      TESTDINO_TAGS: staging,regression,interrupted,filter-verification

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Staging Token
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "::error::TESTDINO_STAGING_TOKEN GitHub secret is required for the staging project."
            exit 1
          fi

      # A non-zero exit is the point here: 7 of the 50 cases fail on purpose, so
      # the step must not go red for doing its job. The reporter has already
      # streamed every result by then.
      - name: Run Status Mix Spec
        env:
          TESTDINO_CI_RUN_ID: ci-status-mix-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run test:status-mix || echo "Expected non-zero exit - 7 cases fail by design."

  playwright:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TESTDINO_SERVER_URL: https://stg-analytics.testdino.com/
      TESTDINO_CI_RUN_ID: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
      TESTDINO_TAGS: smoke,regression,filter-verification

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Verify TestDino Token
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_STAGING_TOKEN }}
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "TESTDINO_STAGING_TOKEN GitHub secret is required for the staging project."
            exit 1
          fi

      - name: Run TestDino Shard ${{ matrix.shard }} of 5
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_STAGING_TOKEN }}
        run: |
          npx playwright test \
            tests/addToCart.spec.ts \
            tests/api-mocking.spec.ts \
            tests/CheckoutPage.spec.ts \
            tests/coverage-verification.spec.ts \
            tests/login.spec.ts \
            --shard=${{ matrix.shard }}/5

      - name: Verify Blob Report
        if: always()
        run: |
          echo "===== ROOT ====="
          ls -la
          echo "===== BLOB REPORT ====="
          ls -R blob-report || true

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  merge-reports:
    needs: playwright
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Download Blob Reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Verify Downloaded Reports
        run: |
          echo "===== DOWNLOADED REPORTS ====="
          ls -R all-blob-reports || true

      - name: Merge Reports
        run: |
          npx playwright merge-reports \
            --reporter html \
            all-blob-reports

      - name: Upload Final HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 30

  coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      BASE_URL: ${{ secrets.COVERAGE_BASE_URL }}
      TESTDINO_DEBUG: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Coverage Secrets
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "TESTDINO_TOKEN GitHub secret is required."
            exit 1
          fi

          if [ -z "$BASE_URL" ]; then
            echo "COVERAGE_BASE_URL GitHub secret is required."
            exit 1
          fi

      - name: Run Instrumentation Check with TestDino Coverage
        env:
          VERIFY_COVERAGE: 'true'
        run: npm run test:coverage -- tests/coverage-verification.spec.ts --project=chromium

      - name: Prepare Local Coverage Report
        run: node scripts/prepare-coverage-report.cjs

      - name: Upload Local Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: testdino-coverage-report
          path: coverage-report
          retention-days: 14
