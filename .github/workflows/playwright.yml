name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  playwright:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TESTDINO_SERVER_URL: https://reporter.testdino.com/
      TESTDINO_CI_RUN_ID: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
      TESTDINO_TAGS: smoke,regression,filter-verification,bhavy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Verify TestDino Token
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "TESTDINO_TOKEN GitHub secret is required."
            exit 1
          fi

      - name: Run TestDino Tests
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
        run: |
          # --server-url is passed explicitly to pin this run to prod:
          # playwright.config.ts hardcodes a serverUrl, and config outranks
          # TESTDINO_SERVER_URL in the reporter's CLI > testdino.config >
          # playwright.config > env resolution order.
          #
          # No sharding: one job runs everything with many parallel workers.
          npx tdpw test \
            --server-url "$TESTDINO_SERVER_URL" \
            --workers=10 \
            tests/CheckoutPage.spec.ts \
            tests/browser-interactions.spec.ts \
            tests/addToCart.spec.ts \
            tests/api-mocking.spec.ts \
            tests/coverage-verification.spec.ts \
            tests/five-thousand-cases.spec.ts

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 30

  coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      BASE_URL: ${{ secrets.COVERAGE_BASE_URL }}
      TESTDINO_DEBUG: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Coverage Secrets
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "TESTDINO_TOKEN GitHub secret is required."
            exit 1
          fi

          if [ -z "$BASE_URL" ]; then
            echo "COVERAGE_BASE_URL GitHub secret is required."
            exit 1
          fi

      - name: Run Instrumentation Check with TestDino Coverage
        env:
          VERIFY_COVERAGE: 'true'
        run: npm run test:coverage -- tests/coverage-verification.spec.ts --project=chromium

      - name: Prepare Local Coverage Report
        run: node scripts/prepare-coverage-report.cjs

      - name: Upload Local Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: testdino-coverage-report
          path: coverage-report
          retention-days: 14
