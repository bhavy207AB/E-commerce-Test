name: Playwright Tests
run-name: ${{ inputs.testdino_rerun_from != '' && format('TestDino re-run @ {0}', inputs.testdino_rerun_sha || 'branch tip') || '' }}

on:
  workflow_dispatch:
    inputs:
      testdino_rerun_from:
        description: 'TestDino source run to re-run from (test_run_...). Leave blank for a normal coverage dispatch.'
        required: false
        default: ''
      testdino_rerun_scope:
        description: 'Which tests to re-run: failed | flaky | failed-and-flaky'
        required: false
        default: 'failed'
      testdino_rerun_test_ids:
        description: 'Comma-separated Playwright test ids (overrides scope)'
        required: false
        default: ''
      testdino_rerun_exclude_ids:
        description: 'Comma-separated test ids to drop from the scope'
        required: false
        default: ''
      testdino_rerun_tags:
        description: 'Extra tags to add to the re-run, on top of the source run tags. Passed to the CLI as --rerun-tags.'
        required: false
        default: ''
      testdino_rerun_sha:
        description: 'Commit to re-run on ("This commit" in TestDino). Blank = the branch tip.'
        required: false
        default: ''
      testdino_selection:
        description: 'Set by TestDino "Run automated tests" (test_selection_...). Leave empty to run the full suite.'
        required: false
        default: ''
  push:
    branches:
      - main
      - testingPR
  pull_request:

jobs:
  playwright:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TESTDINO_SERVER_URL: https://reporter.testdino.com/
      TESTDINO_CI_RUN_ID: ci-run-${{ github.run_id }}-${{ github.run_attempt }}
      TESTDINO_TAGS: smoke,regression,filter-verification

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Verify TestDino Token
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "TESTDINO_TOKEN GitHub secret is required."
            exit 1
          fi

      - name: Run TestDino Shard ${{ matrix.shard }} of 5
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
        run: |
          npx playwright test \
            tests/CheckoutPage.spec.ts \
            tests/addToCart.spec.ts \
            tests/api-mocking.spec.ts \
            tests/login.spec.ts \
            tests/browser-interactions.spec.ts \
            --shard=${{ matrix.shard }}/5

      - name: Verify Blob Report
        if: always()
        run: |
          echo "===== ROOT ====="
          ls -la
          echo "===== BLOB REPORT ====="
          ls -R blob-report || true

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  merge-reports:
    needs: playwright
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Download Blob Reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Verify Downloaded Reports
        run: |
          echo "===== DOWNLOADED REPORTS ====="
          ls -R all-blob-reports || true

      - name: Merge Reports
        run: |
          npx playwright merge-reports \
            --reporter html \
            all-blob-reports

      - name: Upload Final HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 30

  # Runs the single tcm-smoke spec (5 cases) in isolation and reports it to the
  # production TestDino project so the 5 automated tests register there and can
  # be linked 1:1 to manual TCM cases. Kept separate from the sharded playwright
  # job because that job's specs import test/expect from @testdino/playwright
  # (reporter-only) and fail collection; tcm-smoke imports @playwright/test and
  # runs clean on its own.
  tcm-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TESTDINO_SERVER_URL: https://reporter.testdino.com/
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      TESTDINO_TAGS: prod,tcm-smoke

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Prod Token
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "::error::TESTDINO_TOKEN GitHub secret is required for the production project."
            exit 1
          fi

      - name: Run TCM Smoke Spec
        env:
          TESTDINO_CI_RUN_ID: ci-tcm-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npx tdpw test \
            tests/tcm-smoke.spec.ts \
            --project=chromium \
            --reporter=@testdino/playwright

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-tcm-smoke
          path: playwright-report
          retention-days: 30

  coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.testdino_rerun_from == '' && inputs.testdino_selection == ''
    runs-on: ubuntu-latest
    env:
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      BASE_URL: ${{ secrets.COVERAGE_BASE_URL }}
      TESTDINO_DEBUG: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Coverage Secrets
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "TESTDINO_TOKEN GitHub secret is required."
            exit 1
          fi

          if [ -z "$BASE_URL" ]; then
            echo "COVERAGE_BASE_URL GitHub secret is required."
            exit 1
          fi

      - name: Run Instrumentation Check with TestDino Coverage
        env:
          VERIFY_COVERAGE: 'true'
        run: npm run test:coverage -- tests/coverage-verification.spec.ts --project=chromium

      - name: Prepare Local Coverage Report
        run: node scripts/prepare-coverage-report.cjs

      - name: Upload Local Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: testdino-coverage-report
          path: coverage-report
          retention-days: 14

  # Re-runs only a finished run's failed/flaky tests. Dispatched by TestDino
  # (get_rerun_selection / rerun_test) or manually with a testdino_rerun_from
  # input. The tdpw CLI resolves the exact selection from the source run and
  # reports the re-run linked to it. Runs against the same production reporter
  # and token as the selection job, since the source run lives in that project.
  rerun:
    if: github.event_name == 'workflow_dispatch' && inputs.testdino_rerun_from != ''
    runs-on: ubuntu-latest
    env:
      TESTDINO_SERVER_URL: https://reporter.testdino.com/
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      TESTDINO_TAGS: prod,regression

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Pin the re-run to the dispatched commit so "This commit" in TestDino
          # runs that exact SHA. Blank input falls back to the branch tip.
          ref: ${{ inputs.testdino_rerun_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Prod Token
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "::error::TESTDINO_TOKEN GitHub secret is required for the production project."
            exit 1
          fi

      - name: Re-run TestDino Selection
        env:
          TESTDINO_CI_RUN_ID: ci-rerun-${{ github.run_id }}-${{ github.run_attempt }}
          RERUN_FROM: ${{ inputs.testdino_rerun_from }}
          RERUN_SCOPE: ${{ inputs.testdino_rerun_scope }}
          RERUN_TEST_IDS: ${{ inputs.testdino_rerun_test_ids }}
          RERUN_EXCLUDE_IDS: ${{ inputs.testdino_rerun_exclude_ids }}
          RERUN_TAGS: ${{ inputs.testdino_rerun_tags }}
        run: |
          ARGS="--rerun ${RERUN_SCOPE:-failed} --from-run ${RERUN_FROM}"
          if [ -n "${RERUN_TEST_IDS}" ]; then ARGS="$ARGS --test-ids ${RERUN_TEST_IDS}"; fi
          if [ -n "${RERUN_EXCLUDE_IDS}" ]; then ARGS="$ARGS --exclude-ids ${RERUN_EXCLUDE_IDS}"; fi
          if [ -n "${RERUN_TAGS}" ]; then ARGS="$ARGS --rerun-tags ${RERUN_TAGS}"; fi
          echo "Running: npx tdpw test $ARGS --project=chromium"
          npx tdpw test $ARGS --project=chromium

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-rerun
          path: playwright-report
          retention-days: 30

  # Runs the automated tests of a stored TestDino selection, dispatched by
  # TestDino's "Run automated tests" (Test Case Management). An empty selection
  # input runs the full suite. Reports to the production project where the
  # selection and its linked manual cases live. Requires TestDino CLI >= 2.11.0.
  selection:
    if: github.event_name == 'workflow_dispatch' && inputs.testdino_rerun_from == '' && inputs.testdino_selection != ''
    runs-on: ubuntu-latest
    env:
      TESTDINO_SERVER_URL: https://reporter.testdino.com/
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      TESTDINO_TAGS: prod,selection

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Prod Token
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "::error::TESTDINO_TOKEN GitHub secret is required for the production project."
            exit 1
          fi

      - name: Run tests
        env:
          TESTDINO_CI_RUN_ID: ci-selection-${{ github.run_id }}-${{ github.run_attempt }}
          TD_SELECTION: ${{ inputs.testdino_selection }}
        shell: bash
        run: |
          args=()
          if [ -n "$TD_SELECTION" ]; then
            args+=(--selection "$TD_SELECTION")
          fi
          npx tdpw test "${args[@]}" --project=chromium

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-selection
          path: playwright-report
          retention-days: 30
