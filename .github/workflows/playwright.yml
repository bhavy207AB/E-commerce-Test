name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The only spec this workflow runs. One file, one invocation, one STAGING run
  # carrying every status bucket: 40 passed, 7 failed, 3 flaky, 3 skipped and
  # 3 interrupted of 56. See the header of tests/all-status-types.spec.ts for
  # why --max-failures=7, --workers=4 and --retries=1 are load-bearing rather
  # than incidental — which is also why this cannot be sharded: each shard
  # would get its own failure budget and Interrupted would come out empty.
  staging-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Staging, not prod: playwright.config.ts falls back to the prod reporter
      # when TESTDINO_SERVER_URL is unset, so this must be explicit.
      TESTDINO_SERVER_URL: https://stg-analytics.testdino.com/
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_STAGING_TOKEN }}
      TESTDINO_TAGS: staging,regression,interrupted,filter-verification

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Staging Token
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "::error::TESTDINO_STAGING_TOKEN GitHub secret is required for the staging project."
            exit 1
          fi

      # A non-zero exit is the point here: 7 of the 50 cases fail on purpose, so
      # the step must not go red for doing its job. The reporter has already
      # streamed every result by then.
      - name: Run All Status Types Spec
        env:
          TESTDINO_CI_RUN_ID: ci-all-status-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run test:all-status || echo "Expected non-zero exit - 7 cases fail by design."

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 30

  coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      BASE_URL: ${{ secrets.COVERAGE_BASE_URL }}
      TESTDINO_DEBUG: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Coverage Secrets
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "TESTDINO_TOKEN GitHub secret is required."
            exit 1
          fi

          if [ -z "$BASE_URL" ]; then
            echo "COVERAGE_BASE_URL GitHub secret is required."
            exit 1
          fi

      - name: Run Instrumentation Check with TestDino Coverage
        env:
          VERIFY_COVERAGE: 'true'
        run: npm run test:coverage -- tests/coverage-verification.spec.ts --project=chromium

      - name: Prepare Local Coverage Report
        run: node scripts/prepare-coverage-report.cjs

      - name: Upload Local Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: testdino-coverage-report
          path: coverage-report
          retention-days: 14
