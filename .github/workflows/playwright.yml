name: Playwright Tests
run-name: ${{ inputs.testdino_rerun_from != '' && format('TestDino re-run @ {0}', inputs.testdino_rerun_sha || 'branch tip') || '' }}

on:
  workflow_dispatch:
    inputs:
      testdino_rerun_from:
        description: 'TestDino source run to re-run from (test_run_...). Leave blank for a normal coverage dispatch.'
        required: false
        default: ''
      testdino_rerun_scope:
        description: 'Which tests to re-run: failed | flaky | failed-and-flaky'
        required: false
        default: 'failed'
      testdino_rerun_test_ids:
        description: 'Comma-separated Playwright test ids (overrides scope)'
        required: false
        default: ''
      testdino_rerun_exclude_ids:
        description: 'Comma-separated test ids to drop from the scope'
        required: false
        default: ''
      testdino_rerun_tags:
        description: 'Extra tags to add to the re-run, on top of the source run tags. Passed to the CLI as --rerun-tags.'
        required: false
        default: ''
      testdino_rerun_sha:
        description: 'Commit to re-run on ("This commit" in TestDino). Blank = the branch tip.'
        required: false
        default: ''
  push:
    branches:
      - main
      - STAGGING
  pull_request:

jobs:
  # One STAGING run of the genuine product tests only. The specs that exist to
  # manufacture TestDino statuses or verify the reporter — all-status-types,
  # status-mix, coverage-verification, the *-verification specs and
  # testdino-trace-showcase — are deliberately not run here; their results
  # describe the reporter, not the application.
  #
  # Whatever these tests do is the result: pass, fail or flaky, the step does
  # not gate the job. The reporter has streamed every outcome by then.
  staging-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Proper split: each slot runs a distinct, non-overlapping subset of
        # ten-cases by grep so no test is double-counted across splits.
        #   slot 1 → base 'ten-cases' block (cases 1-10)
        #   slot 2 → 'ten-cases batch *' blocks (cases 11-22)
        include:
          - split: 1
            filter: --grep-invert batch
          - split: 2
            filter: --grep batch
    env:
      # Staging, not prod: playwright.config.ts falls back to the prod reporter
      # when TESTDINO_SERVER_URL is unset, so this must be explicit.
      TESTDINO_SERVER_URL: https://stg-analytics.testdino.com/
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_STAGING_TOKEN }}
      TESTDINO_TAGS: staging,regression

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Staging Token
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "::error::TESTDINO_STAGING_TOKEN GitHub secret is required for the staging project."
            exit 1
          fi

      - name: Run Product Tests
        env:
          TESTDINO_CI_RUN_ID: ci-product-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npx tdpw test \
            --split ${{ matrix.split }}/2 \
            --split-id ${{ github.run_id }}-${{ github.run_attempt }} \
            -- \
            tests/ten-cases.spec.ts \
            --project=chromium \
            --workers=2 \
            ${{ matrix.filter }} \
            --reporter=html,@testdino/playwright

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-split-${{ matrix.split }}
          path: playwright-report
          retention-days: 30

  coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.testdino_rerun_from == ''
    runs-on: ubuntu-latest
    env:
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      BASE_URL: ${{ secrets.COVERAGE_BASE_URL }}
      TESTDINO_DEBUG: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Coverage Secrets
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "TESTDINO_TOKEN GitHub secret is required."
            exit 1
          fi

          if [ -z "$BASE_URL" ]; then
            echo "COVERAGE_BASE_URL GitHub secret is required."
            exit 1
          fi

      - name: Run Instrumentation Check with TestDino Coverage
        env:
          VERIFY_COVERAGE: 'true'
        run: npm run test:coverage -- tests/coverage-verification.spec.ts --project=chromium

      - name: Prepare Local Coverage Report
        run: node scripts/prepare-coverage-report.cjs

      - name: Upload Local Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: testdino-coverage-report
          path: coverage-report
          retention-days: 14

  # Re-runs only a finished run's failed/flaky tests. Dispatched by TestDino
  # (get_rerun_selection / rerun_test) or manually with a testdino_rerun_from
  # input. The tdpw CLI resolves the exact selection from the source run and
  # reports the re-run linked to it. Runs against the same staging reporter and
  # token as the staging-tests job, since the source run lives in that project.
  rerun:
    if: github.event_name == 'workflow_dispatch' && inputs.testdino_rerun_from != ''
    runs-on: ubuntu-latest
    env:
      TESTDINO_SERVER_URL: https://stg-analytics.testdino.com/
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_STAGING_TOKEN }}
      TESTDINO_TAGS: staging,regression

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Pin the re-run to the dispatched commit so "This commit" in TestDino
          # runs that exact SHA. Blank input falls back to the branch tip.
          ref: ${{ inputs.testdino_rerun_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Staging Token
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "::error::TESTDINO_STAGING_TOKEN GitHub secret is required for the staging project."
            exit 1
          fi

      - name: Re-run TestDino Selection
        env:
          TESTDINO_CI_RUN_ID: ci-rerun-${{ github.run_id }}-${{ github.run_attempt }}
          RERUN_FROM: ${{ inputs.testdino_rerun_from }}
          RERUN_SCOPE: ${{ inputs.testdino_rerun_scope }}
          RERUN_TEST_IDS: ${{ inputs.testdino_rerun_test_ids }}
          RERUN_EXCLUDE_IDS: ${{ inputs.testdino_rerun_exclude_ids }}
          RERUN_TAGS: ${{ inputs.testdino_rerun_tags }}
        run: |
          ARGS="--rerun ${RERUN_SCOPE:-failed} --from-run ${RERUN_FROM}"
          if [ -n "${RERUN_TEST_IDS}" ]; then ARGS="$ARGS --test-ids ${RERUN_TEST_IDS}"; fi
          if [ -n "${RERUN_EXCLUDE_IDS}" ]; then ARGS="$ARGS --exclude-ids ${RERUN_EXCLUDE_IDS}"; fi
          if [ -n "${RERUN_TAGS}" ]; then ARGS="$ARGS --rerun-tags ${RERUN_TAGS}"; fi
          echo "Running: npx tdpw test $ARGS --project=chromium"
          npx tdpw test $ARGS --project=chromium || echo "Non-zero exit - every result is already in TestDino."

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-rerun
          path: playwright-report
          retention-days: 30
