name: Hundred Cases

# Runs ONLY tests/hundred-cases.spec.ts and streams the result to TestDino
# (staging). Lives on its own branch so the main Playwright workflow's
# 1000-case staging job is not triggered by the same push.
on:
  workflow_dispatch:
  push:
    branches:
      - ci/hundred-cases

jobs:
  hundred-cases:
    runs-on: ubuntu-latest
    env:
      TESTDINO_SERVER_URL: https://stg-analytics.testdino.com/
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_STAGING_TOKEN }}
      TESTDINO_TAGS: staging,hundred-cases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Staging Token
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "::error::TESTDINO_STAGING_TOKEN GitHub secret is required for the staging project."
            exit 1
          fi

      - name: Run Hundred-Cases Spec
        env:
          TESTDINO_CI_RUN_ID: ci-hundred-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npx tdpw test \
            -- \
            tests/hundred-cases.spec.ts \
            --project=chromium \
            --workers=10 \
            --reporter=html,@testdino/playwright

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-hundred
          path: playwright-report
          retention-days: 30
