name: Dashboard Filter Coverage

# Dedicated run for tests/dashboard-filter-coverage.spec.ts only.
# This spec populates the TestDino dashboard Platform (Chromium) and
# "All tags" filters (@E2E, @account, @api, @auth, @cart, @catalog,
# @checkout, @chromium, @content). No other spec in the repo runs here.

on:
  workflow_dispatch:
  push:
    branches:
      - STAGGING
    paths:
      - tests/dashboard-filter-coverage.spec.ts
      - .github/workflows/dashboard-filter-coverage.yml

jobs:
  dashboard-filter-coverage:
    runs-on: ubuntu-latest
    env:
      # Staging reporter + token, matching the other staging jobs. Must be
      # explicit: playwright.config.ts falls back to the prod reporter when
      # TESTDINO_SERVER_URL is unset.
      TESTDINO_SERVER_URL: https://stg-analytics.testdino.com/
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_STAGING_TOKEN }}
      TESTDINO_TAGS: staging,regression

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Staging Token
        run: |
          if [ -z "$TESTDINO_TOKEN" ]; then
            echo "::error::TESTDINO_STAGING_TOKEN GitHub secret is required for the staging project."
            exit 1
          fi

      - name: Run Dashboard Filter Coverage Spec
        env:
          TESTDINO_CI_RUN_ID: ci-dashboard-filters-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npx tdpw test \
            -- \
            tests/dashboard-filter-coverage.spec.ts \
            --project=chromium \
            --workers=10 \
            --reporter=html,@testdino/playwright

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-filter-coverage-report
          path: playwright-report
          retention-days: 30
